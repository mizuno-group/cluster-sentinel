# Sentinel controller configuration for the pseudo-cluster.
#
# Note what is here and what is not: the fileservers and the storage domains
# are declared, because nothing discovers them automatically. The compute nodes
# are not, because Slurm reports them. Both kinds end up in one inventory.

config_version = 1
environment = "testbed"

[controller]
listen = "0.0.0.0:7443"
inventory_interval = "10s"
# Diagnosis is cheap and decides how fast a fault is reported.
diagnosis_interval = "5s"

[database]
path = "/var/lib/sentinel/sentinel.db"

[peer_monitoring]
degree = 3

[discovery.slurm]
enabled = true

[[entities]]
type = "scheduler"
name = "sentinel-testbed"

# Hosts outside Slurm. Sentinel must monitor these exactly as well
# (SPEC.md §180).
[[entities]]
type = "host"
name = "filesrv01"
labels = { role = "fileserver" }

[[entities]]
type = "host"
name = "filesrv02"
labels = { role = "fileserver" }

[[entities]]
type = "storage"
name = "storage01"

[[entities]]
type = "storage"
name = "storage02"

# Two storage domains with different clients, so that a shared-storage failure
# is distinguishable from a client-local one: compute01 and compute02 share
# storage01, while compute03 does not.
[[dependencies]]
from = "storage/storage01"
to = "host/filesrv01"
type = "provides"

[[dependencies]]
from = "storage/storage02"
to = "host/filesrv02"
type = "provides"

[[dependencies]]
from = "host/compute01"
to = "storage/storage01"
type = "uses_storage"

[[dependencies]]
from = "host/compute02"
to = "storage/storage01"
type = "uses_storage"

[[dependencies]]
from = "host/compute03"
to = "storage/storage02"
type = "uses_storage"

# ---------------------------------------------------------------------------
# A compute node that also serves storage, and the head node that mounts it.
#
# This exists to close a loop in the dependency graph that no simpler shape
# has, and that a real cluster has by default:
#
#   storage/compute02-scratch -> host/compute02      (provides)
#   host/compute02            -> scheduler/slurm     (uses_scheduler, from Slurm)
#   scheduler/slurm           -> service/slurmctld   (provides, from Slurm)
#   service/slurmctld         -> host/controller     (hosted_on, from Slurm)
#   host/controller           -> storage/compute02-scratch  (uses_storage)
#
# Walk that transitively from any host and you arrive at every host. A rule
# that asked "does anyone use what this host serves" by reachability therefore
# answered yes for the head node, which exports nothing, and put a critical on
# it. The loop belongs here so the next such rule is tested against it.
# ---------------------------------------------------------------------------
[[entities]]
type = "storage"
name = "compute02-scratch"

[[dependencies]]
from = "storage/compute02-scratch"
to = "host/compute02"
type = "provides"

[[dependencies]]
from = "host/controller"
to = "storage/compute02-scratch"
type = "uses_storage"
