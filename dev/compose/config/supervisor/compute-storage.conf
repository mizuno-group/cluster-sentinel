; Compute role that also serves storage: slurmd + storage service + agent.
[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid
user=root

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:munged]
command=/usr/sbin/munged --foreground
user=munge
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/munged.log
stderr_logfile=/var/log/supervisor/munged.err

[program:sshd]
command=/usr/sbin/sshd -D -e
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/sshd.log
stderr_logfile=/var/log/supervisor/sshd.err

[program:slurmd]
command=/usr/sbin/slurmd -D -vv
autorestart=true
priority=30
startsecs=3
stdout_logfile=/var/log/supervisor/slurmd.log
stderr_logfile=/var/log/supervisor/slurmd.err

[program:sentinel-agent]
command=/usr/local/bin/sentinel --config /etc/sentinel/config.toml agent
autorestart=true
priority=40
startsecs=3
environment=SENTINEL_TOKEN_FILE="/etc/sentinel/token",SENTINEL_LOG="sentinel=debug,info"
stdout_logfile=/var/log/supervisor/sentinel.log
stderr_logfile=/var/log/supervisor/sentinel.err

; This node serves storage as well as computing, which is ordinary on a real
; cluster and was missing here. It is what closes the loop in the dependency
; graph: a storage domain provided by a host that depends on the scheduler,
; which is hosted on the machine that mounts that storage.
[program:storage]
command=/usr/local/bin/storage-service
autorestart=true
priority=35
stdout_logfile=/var/log/supervisor/storage.log
stderr_logfile=/var/log/supervisor/storage.err
