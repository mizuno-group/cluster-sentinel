; Controller role: Slurm control plane, Sentinel controller, and -- as on a
; real head node -- a Sentinel *agent* beside it and an export service that
; answers while exporting nothing.
;
; Both of those exist here because their absence cost two releases. A head node
; with an agent is monitored from inside as well as out, and it is a peer's
; target as well as the controller's own host, which is a shape nothing else in
; this testbed had. And a head node with the NFS server package installed
; answers on the export port with an empty export list, which is the exact
; state that produced a false critical on a real cluster.
[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid
user=root

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:munged]
command=/usr/sbin/munged --foreground
user=munge
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/munged.log
stderr_logfile=/var/log/supervisor/munged.err

[program:sshd]
command=/usr/sbin/sshd -D -e
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/sshd.log
stderr_logfile=/var/log/supervisor/sshd.err

[program:slurmctld]
command=/usr/sbin/slurmctld -D -vv
autorestart=true
priority=30
; munged must be answering before slurmctld tries to authenticate.
startsecs=3
stdout_logfile=/var/log/supervisor/slurmctld.log
stderr_logfile=/var/log/supervisor/slurmctld.err

; The export service, with nothing exported. See the entrypoint: this role
; gets an /etc/exports that is only comments, so the capability is discovered
; and the export list is empty -- a machine with the server package installed
; and no reason to serve.
[program:storage]
command=/usr/local/bin/storage-service
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/storage.log
stderr_logfile=/var/log/supervisor/storage.err

[program:sentinel-controller]
command=/usr/local/bin/sentinel --config /etc/sentinel/config.toml controller
autorestart=true
priority=40
startsecs=3
environment=SENTINEL_TOKEN_FILE="/etc/sentinel/token",SENTINEL_LOG="sentinel=debug,info"
stdout_logfile=/var/log/supervisor/sentinel.log
stderr_logfile=/var/log/supervisor/sentinel.err

; An agent beside the controller, on its own configuration path so the two do
; not fight over /etc/sentinel/config.toml -- the same split `sentinel install
; agent --config` produces in production.
[program:sentinel-agent]
command=/usr/local/bin/sentinel --config /etc/sentinel/agent.toml agent
autorestart=true
priority=50
startsecs=3
environment=SENTINEL_TOKEN_FILE="/etc/sentinel/token",SENTINEL_LOG="sentinel=debug,info"
stdout_logfile=/var/log/supervisor/sentinel-agent.log
stderr_logfile=/var/log/supervisor/sentinel-agent.err
