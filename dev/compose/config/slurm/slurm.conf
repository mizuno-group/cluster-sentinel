# Slurm configuration for the Sentinel pseudo-cluster.
#
# This is testbed deployment data. Nothing here is referenced by Sentinel's
# source; Sentinel discovers all of it at runtime (IMPLEMENTATION.md §101).

ClusterName=sentinel-testbed
SlurmctldHost=controller

SlurmUser=slurm
SlurmdUser=root

SlurmctldPort=6817
SlurmdPort=6818

AuthType=auth/munge
CredType=cred/munge

StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid

SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log

# Containers have no cgroup hierarchy of their own, and Slurm's cgroup plugins
# fail confusingly without one. These plugins need neither. cgroup.conf
# additionally sets CgroupPlugin=disabled, which is what actually stops slurmd
# trying to create a scope over dbus.
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
JobAcctGatherType=jobacct_gather/none

# Accept the configured node definition even though the container reports the
# host's real CPU topology. Without this, slurmd refuses to register with
# "Node configuration differs from hardware" and every node stays DOWN --
# on whatever machine the developer happens to be using.
SlurmdParameters=config_overrides

SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory

# Matches the production setting Sentinel must cope with: a recovered node
# returns to service by itself, and Sentinel records that transition rather
# than causing it (SPEC.md §70).
ReturnToService=1

# Short timeouts so a scenario's effect is visible in seconds rather than
# minutes. Production values are far longer.
SlurmctldTimeout=30
SlurmdTimeout=30
InactiveLimit=0
MinJobAge=300
KillWait=30
Waittime=0

GresTypes=gpu

# RealMemory is set low deliberately: if it exceeded what the container
# actually has, Slurm would drain the node for "Low RealMemory" and every
# scenario would start from a broken baseline.
NodeName=compute01 CPUs=1 RealMemory=256 State=UNKNOWN
NodeName=compute02 CPUs=1 RealMemory=256 State=UNKNOWN
NodeName=compute03 CPUs=1 RealMemory=256 State=UNKNOWN

PartitionName=compute Nodes=compute[01-03] Default=YES MaxTime=INFINITE State=UP
