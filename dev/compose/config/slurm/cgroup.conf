# Slurm cgroup configuration for the pseudo-cluster.
#
# This matches production's cgroup *version* (v2), which the testbed previously
# did not. The remaining divergence is systemd, and it is deliberate and
# documented rather than silent -- see dev/compose/README.md.
#
# What production does:
#
#   Slurm 23.11's cgroup/v2 plugin asks systemd, over dbus, to create a scope
#   for slurmstepd. systemd owns the cgroup tree and delegates a subtree.
#
# What a container can do:
#
#   There is no systemd and no dbus, so that handshake cannot happen.
#   `IgnoreSystemd=yes` makes slurmd create the scope directory itself, which
#   works against a writable cgroup2 mount. The plugin, the hierarchy and the
#   version are all real; only the party that creates the directory differs.
#
# Getting here took several wrong turns, recorded so nobody repeats them:
#
#   * `CgroupPlugin=disabled` does not exist in 23.11 (it arrives later), so
#     naming it makes Slurm hunt for a plugin called "disabled".
#   * Without `IgnoreSystemd=yes`, autodetect fails on the dbus connection with
#     a message about a scope "in a failed state", which says nothing about the
#     real cause.
#   * Docker mounts /sys/fs/cgroup read-only unless the container is
#     privileged, so the scope directory cannot be created without it. See the
#     compose file for why that relaxation is acceptable here and nowhere else.
#   * The parent slice must exist first; the entrypoint creates it.

CgroupPlugin=cgroup/v2
IgnoreSystemd=yes
