---
# 取得する release。
#
# このロールは v0.3.2 以降の機能（`install --binary`、`doctor --json` の
# address 系フィールド）を使います。古い版を指定すると、バイナリを配り終えた
# あとの `install` で失敗します。
#
# この既定値は Cargo.toml の version と一致していることを
# tests/ansible_role.rs が強制します。
sentinel_version: v0.3.8

# このロールが動作する最小バージョン。上の既定を古い版に変える場合も、
# これより下げることはできません。
sentinel_minimum_version: 0.3.2
sentinel_repo: Lzh-Function/cluster-sentinel

# controller の設定から自動で取り込むか。
#
# 有効なとき、以下は controller の config.toml が唯一の出所になります。
# inventory に書く必要はありません。
#
#   environment      不一致の host は別クラスタとして扱われる
#   [probes]         controller と agent で揃っていないと意味がない
#   [tls] の client 側（ca / server_name / insecure_skip_verify）
#   controller の待ち受けポート
#
# 読み取りには controller 自身のバイナリを使うため、daemon が解釈するのと
# 同じ値が配られます。設定ファイルを 2 箇所で保守しなくて済みます。
sentinel_sync_from_controller: true

# controller 上の設定ファイル。同期元です。
sentinel_controller_config: /etc/sentinel/config.toml

# このロールが設定ファイルを書くか。
#
# false にすると、バイナリと unit と credential だけを配り、config.toml には
# 触れません。controller と agent を同居させる host（1 つの設定ファイルに
# [controller] と [agent] の両方を書く）で使います。
sentinel_manage_config: true

# controller と一致させること。
# sentinel_sync_from_controller が有効なら書く必要はありません。
# 書いた場合、controller の値と食い違っていればエラーになります。
sentinel_environment: ""

# controller のアドレス。ポートを省くと controller の listen から補われます。
sentinel_controller_address: ""

# クラスタ内通信の NIC 名。複数 NIC の環境では必ず設定してください。
# 空のままだと agent が推測し、`sentinel doctor` が曖昧である旨を警告します。
sentinel_interface: ""

# UI 上のグループ分けにのみ使われます。probe を有効化することはありません。
sentinel_roles: []

# probe ごとの監視頻度の上書き。空なら既定のままです。
#
#   sentinel_probes:
#     "network.tcp": { interval: "15s" }
#     "gpu.nvidia":  { enabled: false }
#
# **controller にも同じ設定が要ります。** controller は remote probe を
# 自分で実行するため、agent 側だけ変えても controller の観測頻度は変わりません。
# sentinel_sync_from_controller が有効なら controller から取り込まれます。
sentinel_probes: {}

# mutual TLS を使う場合の、この host 固有の証明書。
# CA と server_name は controller から同期されます。
sentinel_tls_client_cert: ""
sentinel_tls_client_key: ""

# controller から同期される値。手で設定する必要はありません。
sentinel_tls_ca: ""
sentinel_tls_server_name: ""
sentinel_tls_insecure: false
sentinel_controller_port: "7443"

# この host を peer observer にするか。
# observer は互いに異なる障害ドメインから 3 台以上選んでください。
sentinel_observer: false

# controller 上の credential の場所。
sentinel_token_source: /etc/sentinel/token

# Release artefact per architecture. Hosts are matched on `ansible_architecture`,
# so a cluster with both kinds needs no special handling in the inventory.
sentinel_artefacts:
  x86_64: sentinel-x86_64-unknown-linux-musl
  aarch64: sentinel-aarch64-unknown-linux-musl

sentinel_binary_path: /usr/local/bin/sentinel
sentinel_config_dir: /etc/sentinel
sentinel_download_dir: /tmp
sentinel_user: sentinel

# journal を読むために必要です。無いと journal.events probe が
# UNSUPPORTED になり、kernel event が収集されません。
sentinel_user_groups: [systemd-journal]
