# 計算ノードの一覧。ansible_host は SSH で到達できるアドレスです。
#
# 各ノードで NIC が複数ある場合は sentinel_interface を必ず設定してください。
# 「どの NIC がクラスタ内通信を担うか」は自動判別できません。

[agents]
node01
node02
node03
node04
fileserver01

[agents:vars]
sentinel_environment = CHANGE-ME-environment
sentinel_controller_address = CHANGE-ME-controller-host:7443
sentinel_interface = CHANGE-ME-interface
sentinel_roles = ["compute"]

# SSH ポートが 22 以外の場合
# ansible_port = 2222

# observer にするノードだけを別グループにする例。
# observer は互いに異なる障害ドメインから 3 台以上選んでください。
[observers]
node01
node03
fileserver01

[observers:vars]
sentinel_observer = true
